name: Build and deploy SkoHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          rm -rf public data
          mkdir -p public data
          chmod -R 777 public data

      - name: Clone vocabulary repository
        run: |
          git clone "https://github.com/$GITHUB_REPOSITORY.git" data/

      - name: Create .env
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          echo "BASEURL=/$repo" > .env

      - name: Build SkoHub site
        run: |
          docker run \
            -v "$(pwd)/public:/app/public" \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/.env:/app/.env" \
            -v "$(pwd)/config.yaml:/app/config.yaml" \
            -e "GATSBY_RESPOSITORY_URL=https://github.com/$GITHUB_REPOSITORY" \
            skohub/skohub-vocabs-docker:latest

      - name: Show generated files
        run: |
          find public -maxdepth 2 -type f | head -100

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true