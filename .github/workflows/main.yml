name: Build /public and deploy to gh-pages with docker container

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  all-ttl-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.file-list }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find TTL files
        id: find-ttl
        run: |
          ttl_files=$(find . -name '*.ttl' -printf '"%p",' | sed 's/,$//')
          echo "ttl_files=$ttl_files"
          echo "ttl_files=$ttl_files" >> "$GITHUB_ENV"

      - name: Set matrix for TTL files
        id: set-matrix
        run: |
          echo "file-list=[${ttl_files}]" >> "$GITHUB_OUTPUT"

      - name: List all TTL files
        run: |
          echo "${ttl_files}"

  changedfiles:
    runs-on: ubuntu-latest
    outputs:
      ttl: ${{ steps.set-ttl-matrix.outputs.ttl }}
      yml: ${{ steps.set-yml-matrix.outputs.yml }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed TTL files
        id: changed-ttl-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.ttl
          json: true

      - name: Get changed YAML files
        id: changed-yml-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.yml
            **/*.yaml
          json: true

      - name: Set Turtle file matrix
        id: set-ttl-matrix
        run: |
          echo 'ttl=${{ steps.changed-ttl-files.outputs.all_changed_files }}' >> "$GITHUB_OUTPUT"

      - name: Set YAML file matrix
        id: set-yml-matrix
        run: |
          echo 'yml=${{ steps.changed-yml-files.outputs.all_changed_files }}' >> "$GITHUB_OUTPUT"

  prepare-matrix:
    runs-on: ubuntu-latest
    needs:
      - changedfiles
      - all-ttl-files

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Determine matrix
        id: set-matrix
        run: |
          changed_files_ttl='${{ needs.changedfiles.outputs.ttl }}'
          changed_files_yml='${{ needs.changedfiles.outputs.yml }}'

          if [ "$(echo "$changed_files_ttl" | jq length)" -gt 0 ]; then
            echo "matrix=$changed_files_ttl" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$changed_files_yml" | jq length)" -gt 0 ]; then
            echo 'matrix=${{ needs.all-ttl-files.outputs.matrix }}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix

    if: needs.prepare-matrix.outputs.matrix != '[]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove existing build directories
        run: |
          rm -rf public data

      - name: Create build directories
        run: |
          mkdir -p public data
          chmod -R 777 public data

      - name: Clone repository into data directory
        run: |
          git clone "https://github.com/$GITHUB_REPOSITORY.git" data/

      - name: Create .env file
        run: |
          input="$GITHUB_REPOSITORY"
          repo="${input#*/}"
          echo "BASEURL=/$repo" > .env

      - name: Build public directory with SkoHub Docker image
        run: |
          docker run \
            -v "$(pwd)/public:/app/public" \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/.env:/app/.env" \
            -v "$(pwd)/config.yaml:/app/config.yaml" \
            -e "GATSBY_RESPOSITORY_URL=https://github.com/$GITHUB_REPOSITORY" \
            skohub/skohub-vocabs-docker:latest

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages